# Render Blueprint: FREE staging preview of the Gindi Innovations website.
# Full guide: docs/deployment-render.md. No paid resources are defined here.
services:
  - type: web
    name: gindi-website
    runtime: python
    plan: free
    # Closest available region to Egypt. Cannot be changed after creation.
    region: frankfurt
    branch: main
    # Every push to main redeploys automatically.
    autoDeployTrigger: commit
    buildCommand: bash build.sh
    startCommand: gunicorn -c gunicorn.conf.py config.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      # Random 256-bit value generated by Render; never stored in the repo.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Staging database: SQLite created by the build (admin/sessions only;
      # the pages make no queries). Reset on every deploy, restart and
      # spin-down. See docs/deployment-render.md before changing.
      - key: DATABASE_URL
        value: sqlite:///db.sqlite3
      - key: WEB_CONCURRENCY
        value: "2"
      # Preview: keep search engines out.
      - key: SITE_NOINDEX
        value: "true"
      # HSTS stays off on the preview; enable only on the real domain.
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "0"
      # Integrations (enquiry form, WhatsApp, free-tool agents) are not set
      # here: add them later under the service's Environment tab.
