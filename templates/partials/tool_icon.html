{% comment %}
Thin outline icon for a free tool (homepage Services section, Services page).
Parameters: slug; icon_class (default svc-cell__icon). Stroke only, in
currentColor (gold in the page CSS); decorative.
{% endcomment %}
<svg class="{{ icon_class|default:'svc-cell__icon' }}" viewBox="0 0 48 48" aria-hidden="true" focusable="false" fill="none" stroke="currentColor"
     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  {% if slug == "wire" %}
    {# A coil of wire seen at an angle: stacked loops around an open core. #}
    <ellipse cx="24" cy="17" rx="19" ry="8"/>
    <path d="M5 17v4c0 4.4 8.5 8 19 8s19-3.6 19-8v-4"/>
    <path d="M5 21v4c0 4.4 8.5 8 19 8s19-3.6 19-8v-4"/>
    <path d="M5 25v4c0 4.4 8.5 8 19 8s19-3.6 19-8v-4"/>
    <ellipse cx="24" cy="17" rx="9" ry="3.4"/>
    <path d="M10 15.2c3.2-2.6 8.4-4.2 14-4.2s10.8 1.6 14 4.2"/>
  {% elif slug == "tiles" %}
    <rect x="6" y="6" width="16" height="16"/>
    <rect x="26" y="6" width="16" height="16"/>
    <rect x="6" y="26" width="16" height="16"/>
    <rect x="26" y="26" width="16" height="16"/>
  {% elif slug == "bricks" %}
    {# Bricks stacked in three courses: 3, 2, 1. #}
    <rect x="3" y="31" width="14" height="9"/>
    <rect x="17" y="31" width="14" height="9"/>
    <rect x="31" y="31" width="14" height="9"/>
    <rect x="10" y="22" width="14" height="9"/>
    <rect x="24" y="22" width="14" height="9"/>
    <rect x="17" y="13" width="14" height="9"/>
  {% elif slug == "paint" %}
    {# A paint roller: the sleeve, its frame and handle, over a painted stroke. #}
    <rect x="8" y="6" width="26" height="9" rx="4.5"/>
    <path d="M34 10.5h4.5v9H23v6"/>
    <rect x="20.5" y="25.5" width="5" height="16" rx="1.5"/>
    <path d="M8 15v2.5c0 1.4 1.1 2.5 2.5 2.5h1"/>
  {% endif %}
</svg>
